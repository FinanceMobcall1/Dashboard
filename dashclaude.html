<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mobcall</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ff 100%);
            color: #0f172a;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header-content p {
            font-size: 14px;
            opacity: 0.9;
        }

        .btn-refresh {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh:hover {
            background: #1e40af;
        }

        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .grid-kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #3b82f6;
        }

        .kpi-card.success {
            border-left-color: #10b981;
        }

        .kpi-card.danger {
            border-left-color: #ef4444;
        }

        .kpi-card.warning {
            border-left-color: #f59e0b;
        }

        .kpi-label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 800;
            font-family: 'Poppins', sans-serif;
            color: #0f172a;
        }

        .table-box {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        .table-box h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f8fafc;
            position: sticky;
            top: 0;
        }

        th {
            padding: 14px;
            text-align: left;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            font-size: 11px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-info {
            background: #ecf0ff;
            color: #2563eb;
        }

        .error-message {
            background: #fef2f2;
            border: 2px solid #fecaca;
            color: #991b1b;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-content">
            <h1>Gestão Financeira Mobcall</h1>
            <p>Visão integrada de caixa, pagamentos e decisões estratégicas</p>
        </div>
        <div>
            <button class="btn-refresh" id="btnAtualizar" onclick="carregarDados()">
                <i class="fa-solid fa-rotate-right"></i> Atualizar
            </button>
        </div>
    </div>

    <div id="conteudo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
    const URLs = {
        lancamentos: 'https://raw.githubusercontent.com/FinanceMobcall1/Dashboard/main/Lançamentos.csv',
        fluxoCaixa: 'https://raw.githubusercontent.com/FinanceMobcall1/Dashboard/main/Fluxo%20Caixa%20(1).csv',
        decisoes: 'https://raw.githubusercontent.com/FinanceMobcall1/Dashboard/main/Fluxo%20Decisões.csv'
    };

    function parseCSV(csv) {
        const lines = csv.split('\n');
        if (lines.length < 2) return [];

        const headers = lines[0].split(',').map(h => h.trim());
        const data = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;

            const values = lines[i].split(',').map(v => v.trim());
            const obj = {};

            for (let j = 0; j < headers.length; j++) {
                obj[headers[j]] = values[j] || '';
            }

            data.push(obj);
        }

        return data;
    }

    function num(v) {
        if (!v || v === "-" || v === "") return 0;
        let s = String(v).replace("R$", "").trim();
        if (s.includes(",") && s.includes(".")) {
            s = s.replace(/\./g, "").replace(",", ".");
        } else if (s.includes(",")) {
            s = s.replace(",", ".");
        }
        return parseFloat(s) || 0;
    }

    function real(v) {
        return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function carregarDados() {
        const conteudo = document.getElementById('conteudo');
        const btn = document.getElementById('btnAtualizar');

        btn.disabled = true;
        conteudo.innerHTML = '<div class="loading"><div class="spinner"></div><p>Carregando dados...</p></div>';

        try {
            const [lancamentos, fluxoCaixa, decisoes] = await Promise.all([
                fetch(URLs.lancamentos).then(r => r.text()).then(csv => parseCSV(csv)),
                fetch(URLs.fluxoCaixa).then(r => r.text()).then(csv => parseCSV(csv)),
                fetch(URLs.decisoes).then(r => r.text()).then(csv => parseCSV(csv))
            ]);

            renderizarDashboard(lancamentos, fluxoCaixa, decisoes);
            btn.disabled = false;

        } catch (erro) {
            console.error("Erro:", erro);
            conteudo.innerHTML = '<div class="error-message">Erro ao carregar dados. Verifique o console.</div>';
            btn.disabled = false;
        }
    }

    function renderizarDashboard(lancamentos, fluxoCaixa, decisoes) {
        let rec = 0, des = 0, pen = 0;
        let pendenciasArray = [];

        lancamentos.forEach(r => {
            if (!r.Valor) return;

            let v = num(r.Valor);
            let status = String(r.Status || "").toLowerCase();
            let tipo = String(r.Tipo || "").toLowerCase();

            if (status.includes("realizado") || status.includes("pago")) {
                if (tipo.includes("receber")) {
                    rec += v;
                } else {
                    des += Math.abs(v);
                }
            } else if (status.includes("pendente")) {
                pen += Math.abs(v);
                pendenciasArray.push({
                    data: r.Data,
                    descricao: r.Descrição,
                    categoria: r.Categoria,
                    tipo: tipo,
                    valor: v
                });
            }
        });

        const saldo = rec - des;

        let html = `
            <div class="grid-kpis">
                <div class="kpi-card success">
                    <div class="kpi-label">Receitas Realizadas</div>
                    <div class="kpi-value">${real(rec)}</div>
                </div>

                <div class="kpi-card danger">
                    <div class="kpi-label">Despesas Realizadas</div>
                    <div class="kpi-value">${real(des)}</div>
                </div>

                <div class="kpi-card ${saldo >= 0 ? 'success' : 'danger'}">
                    <div class="kpi-label">Saldo</div>
                    <div class="kpi-value">${real(saldo)}</div>
                </div>

                <div class="kpi-card warning">
                    <div class="kpi-label">Pendências Totais</div>
                    <div class="kpi-value">${real(pen)}</div>
                </div>
            </div>

            <div class="table-box">
                <h2>Pendências</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${pendenciasArray.length > 0 ? pendenciasArray.map(p => `
                                <tr>
                                    <td>${p.data}</td>
                                    <td>${p.descricao}</td>
                                    <td><span class="badge badge-info">${p.categoria}</span></td>
                                    <td>${p.tipo.includes('receber') ? 'A Receber' : 'A Pagar'}</td>
                                    <td>${real(p.valor)}</td>
                                </tr>
                            `).join('') : '<tr><td colspan="5" style="text-align: center;">Sem pendências</td></tr>'}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="table-box">
                <h2>Fluxo de Caixa</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Saldo Inicial</th>
                                <th>Entradas</th>
                                <th>Saídas</th>
                                <th>Saldo Final</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${fluxoCaixa.length > 0 ? fluxoCaixa.map(f => `
                                <tr>
                                    <td>${f.Data}</td>
                                    <td>${real(num(f['Saldo Inicial']))}</td>
                                    <td>${real(num(f.Entradas))}</td>
                                    <td>${real(num(f.Saidas))}</td>
                                    <td><strong>${real(num(f['Saldo Final']))}</strong></td>
                                </tr>
                            `).join('') : '<tr><td colspan="5" style="text-align: center;">Sem dados</td></tr>'}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="table-box">
                <h2>Decisões</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Observação</th>
                                <th>Saldo Previsto</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${decisoes.length > 0 ? decisoes.map(d => `
                                <tr>
                                    <td>${d.Data}</td>
                                    <td>${d.Observações}</td>
                                    <td><strong>${real(num(d['Saldo Final']))}</strong></td>
                                </tr>
                            `).join('') : '<tr><td colspan="3" style="text-align: center;">Sem dados</td></tr>'}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        document.getElementById('conteudo').innerHTML = html;
    }

    window.addEventListener('load', carregarDados);
</script>

</body>
</html>
